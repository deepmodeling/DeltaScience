services:
  main:
    environment:
      RETRO_TRIAL_ID: ${COMPOSE_PROJECT_NAME}
      RETRO_P_ENDPOINT: http://p-service:20765
      RETRO_ROLE: agent
      RETRO_ACTIVE_VARIANT: open
    depends_on:
      p-service:
        condition: service_healthy
    networks:
    - default
    - retro-rpc
    volumes:
    - retro-binding:/run/retro-client
    - retro-grader:/run/retro-grader
    - ${CONTEXT_DIR}/retro-native:/opt/retro-native:ro
    - ${CONTEXT_DIR}/retro-native/binding.py:/opt/retro/main/binding.py:ro
    - ${CONTEXT_DIR}/retro-native/open_contract.py:/opt/retro/main/service_contract.py:ro
    - ${CONTEXT_DIR}/views/open/task.json:/workspace/task/task.json:ro
    - ${CONTEXT_DIR}/views/open/variants/open/instruction.md:/workspace/task/variants/open/instruction.md:ro
    security_opt:
    - no-new-privileges:true
    platform: linux/amd64
    entrypoint:
    - /usr/local/bin/python
    - -I
    - -B
    - /opt/retro-native/native_bridge.py
    - start-main
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/python
      - -I
      - -B
      - /opt/retro/main/entrypoint.py
      - check
      interval: 5s
      timeout: 15s
      retries: 120
  p-service:
    image: registry.dp.tech/public/pkscience-retro-p-service@sha256:f5b8a643ec1f74368e86b3f957738cb624d0f1c3bf0ccd77a3c9b82daa557c1b
    pull_policy: missing
    environment:
      RETRO_TRIAL_ID: ${COMPOSE_PROJECT_NAME}
    volumes:
    - ${CONTEXT_DIR}/retro-native/public_stock_view_v17.py:/opt/retro/pservice/public_stock_view_v17.py:ro
    - ${CONTEXT_DIR}/retro-native/native_gold_stock_v16.py:/opt/retro/pservice/native_gold_stock_v16.py:ro
    - ${CONTEXT_DIR}/service-view:/workspace/task:ro
    - ${CONTEXT_DIR}/service-resources/assets/stock/common_reagents.json:/opt/retro/assets/stock/common_reagents.json:ro
    - ${CONTEXT_DIR}/retro-native/open_contract.py:/opt/retro/pservice/contract.py:ro
    - ${CONTEXT_DIR}/retro-native/http_service.py:/opt/retro/pservice/http_service.py:ro
    tmpfs:
    - /state:uid=1001,gid=1001,mode=700,size=1073741824
    - /tmp:uid=1001,gid=1001,mode=700,size=268435456
    networks:
    - retro-rpc
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    platform: linux/amd64
  grader:
    tmpfs:
    - /workspace/outputs:uid=0,gid=0,mode=700,size=10485760
    - /logs/verifier:uid=0,gid=0,mode=700,size=1073741824
    image: registry.dp.tech/public/pkscience-r-dan-12-isolated-grader@sha256:f9839329213698276dc72b76f1340efdc8b3d7cfcf49b403e3ebdf10ad9d2929
    pull_policy: missing
    platform: linux/amd64
    user: 0:0
    entrypoint:
    - /usr/local/bin/python
    - -I
    - -B
    - /opt/retro-native/native_bridge.py
    - serve
    environment:
      RETRO_TRIAL_ID: ${COMPOSE_PROJECT_NAME}
      RETRO_P_ENDPOINT: http://p-service:20765
      RETRO_ROLE: verifier
      RETRO_SERVICE_BINDING_SOURCE: /run/retro-platform/service.json
    depends_on:
      main:
        condition: service_healthy
    volumes:
    - retro-binding:/run/retro-platform:ro
    - retro-grader:/run/retro-grader
    - ${CONTEXT_DIR}/retro-native:/opt/retro-native:ro
    - ${CONTEXT_DIR}/retro-native/binding.py:/opt/retro/main/binding.py:ro
    - ${CONTEXT_DIR}/retro-native/open_contract.py:/opt/retro/main/service_contract.py:ro
    - ${CONTEXT_DIR}/views/open/task.json:/workspace/task/task.json:ro
    - ${CONTEXT_DIR}/reward-overlay/evaluate.py:/tests/evaluate.py:ro
    - ${CONTEXT_DIR}/reward-overlay/lib/gold_baseline.py:/tests/lib/gold_baseline.py:ro
    - ${CONTEXT_DIR}/reward-overlay/lib/route_reward.py:/tests/lib/route_reward.py:ro
    - ${CONTEXT_DIR}/reward-overlay/reward-policy.json:/tests/reward-policy.json:ro
    - ${CONTEXT_DIR}/reward-overlay/task.json:/tests/task.json:ro
    - ${CONTEXT_DIR}/retro-native/grader-test.sh:/tests/test.sh:ro
    - ${CONTEXT_DIR}/reward-overlay/gold_reference.json:/tests/gold_reference.json:ro
    - ${CONTEXT_DIR}/reward-overlay/rubrics.md:/tests/rubrics.md:ro
    - ${CONTEXT_DIR}/reward-overlay/release:/tests/release:ro
    networks:
    - default
    - retro-rpc
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/python
      - -I
      - -B
      - /opt/retro-native/native_bridge.py
      - health
      interval: 5s
      timeout: 10s
      retries: 120
    cpus: 4
    mem_limit: 8192M
    cap_add:
    - DAC_OVERRIDE
networks:
  retro-rpc:
    internal: true
volumes:
  retro-binding: {}
  retro-grader: {}
